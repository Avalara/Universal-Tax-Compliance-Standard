# Node.js 24 is the pinned runtime. See .nvmrc.
# Renovate configuration for dependency updates is renovate.json.
image: node:24

stages:
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

spec:
  stage: test
  script:
    - node --version
    - cd spec
    - npm ci
    - npm run validate
